  <circle cx="178.00" cy="191.05" r="3.5" class="point"/>
  <circle cx="291.00" cy="161.11" r="3.5" class="point"/>
  <circle cx="404.00" cy="131.16" r="3.5" class="point"/>
  <circle cx="517.00" cy="101.21" r="3.5" class="point"/>
  <circle cx="291.00" cy="161.11" r="4.5" class="focus"/>
