  <text x="517" y="247" class="tick" text-anchor="middle">4</text>
  <text x="291" y="281" class="unit" text-anchor="middle">4手で拾える最大数　個</text>
  <path d="M65.00 221.00 L178.00 191.05 L291.00 161.11 L404.00 131.16 L517.00 101.21" class="curve"/>
