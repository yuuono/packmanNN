 <title id="title">通常時のパワー活用の応答曲線</title>
 <desc id="desc">エサまでの距離の増加とともに得点が減少　同じエサの距離でも現在地に敵が近いほど加点　エサまで4マスで活動中の敵がいないときは0.275点</desc>
