<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="326" viewBox="0 0 1120 326"
     role="img" aria-labelledby="title description" lang="ja" xml:lang="ja">
  <title id="title">Utility AI による次の1手の選択</title>
  <desc id="description">通れる方向ごとに4項目を採点　スライダーまたは学習済みNNが決めた重みを各点数に掛けて合計　総合点が最も高い方向へ1マス移動</desc>
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif; fill: #f4f2ff }
    .heading { font-size: 25px; font-weight: 700 }
    .label { font-size: 21px; font-weight: 600 }
    .detail { font-size: 20px; fill: #d8d7e8 }
    .panel { fill: #202035; stroke: #59596e; stroke-width: 1.6 }
    .connector { fill: none; stroke: #d8d7e8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round }
  </style>
  <rect width="1120" height="326" fill="#151528"/>

  <!-- Shared weights enter the aggregation step for all candidate directions -->
  <rect x="547" y="6" width="330" height="74" rx="14" fill="#29283f" stroke="#bca8ff" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="712" y="34" class="detail">スライダーまたは学習済みNN</text>
    <text x="712" y="63" font-size="24" font-weight="700" style="fill:#d7caff">4項目の重み</text>
  </g>
  <path d="M712 82V111 M705 104L712 111L719 104" fill="none" stroke="#bca8ff"
        stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <rect x="3" y="121" width="182" height="188" rx="15" class="panel"/>
  <text x="94" y="164" text-anchor="middle" class="heading">通れる方向</text>
  <g fill="none" stroke="#ffdb6e" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M94 208V186 M86 194L94 186L102 194"/>
    <path d="M94 226V248 M86 240L94 248L102 240"/>
    <path d="M85 217H63 M71 209L63 217L71 225"/>
  </g>
  <circle cx="94" cy="217" r="6" fill="#ffdb6e"/>
  <text x="94" y="282" text-anchor="middle" class="detail">交差点の候補例</text>

  <path d="M191 214H221 M214 207L221 214L214 221" class="connector"/>

  <rect x="229" y="121" width="294" height="188" rx="15" class="panel"/>
  <text x="376" y="164" text-anchor="middle" class="heading">方向ごとの採点</text>
  <rect x="247" y="191" width="7" height="20" rx="3.5" fill="#ffdb6e"/>
  <text x="265" y="208" class="label">目先の採餌</text>
  <rect x="386" y="191" width="7" height="20" rx="3.5" fill="#bca8ff"/>
  <text x="404" y="208" class="label">全体の回収</text>
  <rect x="247" y="230" width="7" height="20" rx="3.5" fill="#96ece7"/>
  <text x="265" y="247" class="label">慎重さ</text>
  <rect x="386" y="230" width="7" height="20" rx="3.5" fill="#ff9b9e"/>
  <text x="404" y="247" class="label">パワー活用</text>
  <text x="376" y="282" text-anchor="middle" class="detail">各項目に0〜1の点数</text>

  <path d="M530 214H560 M553 207L560 214L553 221" class="connector"/>

  <rect x="568" y="121" width="288" height="188" rx="15" class="panel"/>
  <text x="712" y="164" text-anchor="middle" class="heading">重み付きの合計</text>
  <text x="712" y="214" text-anchor="middle" font-size="25" font-weight="700">項目の点数 × 重み</text>
  <path d="M599 234H825" stroke="#59596e" stroke-width="1.5"/>
  <text x="712" y="270" text-anchor="middle" class="detail">4項目の合計が方向の総合点</text>

  <path d="M863 214H893 M886 207L893 214L886 221" class="connector"/>

  <rect x="901" y="121" width="216" height="188" rx="15" fill="#203334" stroke="#96ece7" stroke-width="2"/>
  <text x="1009" y="164" text-anchor="middle" class="heading">次の1手</text>
  <text x="1009" y="216" text-anchor="middle" class="detail">総合点が最大の方向</text>
  <text x="1009" y="262" text-anchor="middle" font-size="31" font-weight="700" style="fill:#96ece7">1マス移動</text>
</svg>
