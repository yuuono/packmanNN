<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="245" viewBox="0 0 1120 245"
     role="img" aria-labelledby="title description" lang="ja" xml:lang="ja">
  <title id="title">左の通路での到着の余裕</title>
  <desc id="description">5手後の盤面で左へ進む場合の距離の比較　自分の歩数は1から6　活動中のゴーストからの最短距離は8から3　5マス目から敵の経路のほうが短い</desc>
  <style>
    text { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif }
    .header { font-size: 22px; font-weight: 600; fill: #f4f2ff }
    .number { font-size: 23px; font-weight: 600; fill: #f4f2ff; font-variant-numeric: tabular-nums }
    .margin { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums }
    .key { font-size: 21px; font-weight: 600 }
  </style>
  <rect width="1120" height="245" fill="#151528"/>
  <text x="12" y="68" class="header">左の通路</text>
  <text x="12" y="113" class="key" fill="#ffdb6e">自分の歩数</text>
  <text x="12" y="152" class="key" fill="#ccbcff">敵の最短距離</text>
  <text x="12" y="208" class="key" fill="#f4f2ff">到着の余裕</text>
  <g text-anchor="end" font-size="18" fill="#c1bfd2">
    <text x="202" y="113">歩</text>
    <text x="202" y="152">マス</text>
    <text x="202" y="208">マス</text>
  </g>
  <text x="965" y="25" text-anchor="middle" font-size="20" font-weight="600" fill="#ffb9bf">敵が先に届き得る区間</text>
  <g transform="translate(219 0)">
    <rect x="0" y="38" width="145" height="188" rx="10" fill="#252539" stroke="#4e4e64" stroke-width="1"/>
    <text x="72.5" y="68" text-anchor="middle" class="header">1マス目</text>
    <path d="M10 80h125 M10 173h125" stroke="#48485e" stroke-width="1.5"/>
    <text x="17" y="113" class="number">1</text>
    <rect x="48" y="100" width="10" height="9" rx="4.5" fill="#ffdb6e"/>
    <text x="17" y="152" class="number">8</text>
    <rect x="48" y="139" width="80" height="9" rx="4.5" fill="#bca8ff"/>
    <text x="72.5" y="208" text-anchor="middle" class="margin" fill="#96ece7">＋7</text>
  </g>
  <g transform="translate(369 0)">
    <rect x="0" y="38" width="145" height="188" rx="10" fill="#252539" stroke="#4e4e64" stroke-width="1"/>
    <text x="72.5" y="68" text-anchor="middle" class="header">2マス目</text>
    <path d="M10 80h125 M10 173h125" stroke="#48485e" stroke-width="1.5"/>
    <text x="17" y="113" class="number">2</text>
    <rect x="48" y="100" width="20" height="9" rx="4.5" fill="#ffdb6e"/>
    <text x="17" y="152" class="number">7</text>
    <rect x="48" y="139" width="70" height="9" rx="4.5" fill="#bca8ff"/>
    <text x="72.5" y="208" text-anchor="middle" class="margin" fill="#96ece7">＋5</text>
  </g>
  <g transform="translate(519 0)">
    <rect x="0" y="38" width="145" height="188" rx="10" fill="#252539" stroke="#4e4e64" stroke-width="1"/>
    <text x="72.5" y="68" text-anchor="middle" class="header">3マス目</text>
    <path d="M10 80h125 M10 173h125" stroke="#48485e" stroke-width="1.5"/>
    <text x="17" y="113" class="number">3</text>
    <rect x="48" y="100" width="30" height="9" rx="4.5" fill="#ffdb6e"/>
    <text x="17" y="152" class="number">6</text>
    <rect x="48" y="139" width="60" height="9" rx="4.5" fill="#bca8ff"/>
    <text x="72.5" y="208" text-anchor="middle" class="margin" fill="#96ece7">＋3</text>
  </g>
  <g transform="translate(669 0)">
    <rect x="0" y="38" width="145" height="188" rx="10" fill="#252539" stroke="#4e4e64" stroke-width="1"/>
    <text x="72.5" y="68" text-anchor="middle" class="header">4マス目</text>
    <path d="M10 80h125 M10 173h125" stroke="#48485e" stroke-width="1.5"/>
    <text x="17" y="113" class="number">4</text>
    <rect x="48" y="100" width="40" height="9" rx="4.5" fill="#ffdb6e"/>
    <text x="17" y="152" class="number">5</text>
    <rect x="48" y="139" width="50" height="9" rx="4.5" fill="#bca8ff"/>
    <text x="72.5" y="208" text-anchor="middle" class="margin" fill="#96ece7">＋1</text>
  </g>
  <g transform="translate(819 0)">
    <rect x="0" y="38" width="145" height="188" rx="10" fill="#3b2839" stroke="#e3919c" stroke-width="2"/>
    <text x="72.5" y="68" text-anchor="middle" class="header">5マス目</text>
    <path d="M10 80h125 M10 173h125" stroke="#71485b" stroke-width="1.5"/>
    <text x="17" y="113" class="number">5</text>
    <rect x="48" y="100" width="50" height="9" rx="4.5" fill="#ffdb6e"/>
    <text x="17" y="152" class="number">4</text>
    <rect x="48" y="139" width="40" height="9" rx="4.5" fill="#bca8ff"/>
    <text x="72.5" y="208" text-anchor="middle" class="margin" fill="#ffb9bf">−1</text>
  </g>
  <g transform="translate(969 0)">
    <rect x="0" y="38" width="145" height="188" rx="10" fill="#3b2839" stroke="#e3919c" stroke-width="2"/>
    <text x="72.5" y="68" text-anchor="middle" class="header">6マス目</text>
    <path d="M10 80h125 M10 173h125" stroke="#71485b" stroke-width="1.5"/>
    <text x="17" y="113" class="number">6</text>
    <rect x="48" y="100" width="60" height="9" rx="4.5" fill="#ffdb6e"/>
    <text x="17" y="152" class="number">3</text>
    <rect x="48" y="139" width="30" height="9" rx="4.5" fill="#bca8ff"/>
    <text x="72.5" y="208" text-anchor="middle" class="margin" fill="#ffb9bf">−3</text>
  </g>
</svg>
