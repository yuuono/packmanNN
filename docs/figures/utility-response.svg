<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc" lang="ja">
  <title id="title">到着の余裕と慎重さの応答曲線</title>
  <desc id="desc">余裕が−2マス以下なら0点　7マス以上なら1点　途中では余裕が1マス増えるごとに9分の1点増える　交差点の左は余裕−3で0点　上は余裕3で約0.556点　下は余裕7で1点</desc>
  <style>
    text { fill: #171717; font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
    .axis { fill: none; stroke: #4a4a4a; stroke-width: 1.5; }
    .grid { fill: none; stroke: #d8d8d8; stroke-width: 1; }
    .guide { fill: none; stroke: #666; stroke-width: 1.2; stroke-dasharray: 4 5; }
    .tick { font-size: 17px; }
    .label { font-size: 21px; font-weight: 600; }
    .point { fill: #fff; stroke: #181818; stroke-width: 3; }
  </style>
  <rect width="1120" height="310" fill="#fff"/>
  <text x="38" y="36" class="label">慎重さの点</text>
  <path class="grid" d="M90 71H1059 M90 147.5H1059"/>
  <path class="axis" d="M90 54V224H1059 M261 224v6 M318 224v6 M603 224v6 M831 224v6"/>
  <g class="tick" text-anchor="end">
    <text x="77" y="230">0</text><text x="77" y="153.5">0.5</text><text x="77" y="77">1</text>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="90" y="251">−6</text><text x="261" y="251">−3</text><text x="318" y="251">−2</text>
    <text x="603" y="251">3</text><text x="831" y="251">7</text><text x="1059" y="251">11</text>
  </g>
  <text x="574.5" y="290" text-anchor="middle" class="label">通路で最も小さい到着の余裕　マス</text>
  <path class="guide" d="M603 224V139 M831 224V71"/>
  <path fill="none" stroke="#181818" stroke-width="3.5" d="M90 224H318L831 71H1059"/>
  <g class="point">
    <circle cx="261" cy="224" r="6"/><circle cx="603" cy="139" r="6"/><circle cx="831" cy="71" r="6"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="261" y="200">左　0点</text>
    <text x="578" y="118">上　約0.556点</text>
    <text x="831" y="47">下　1点</text>
  </g>
</svg>
