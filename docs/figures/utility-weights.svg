<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="375" viewBox="0 0 1120 375" role="img" aria-labelledby="title desc">
  <title id="title">同じ交差点での総合点の比較</title>
  <desc id="desc">均等配分では上が0.690点で首位　慎重重視では下の慎重さの寄与だけで0.700点となり総合0.861点で首位</desc>
  <style>
    text { font-family: 'Hiragino Sans', 'Yu Gothic', 'Noto Sans CJK JP', sans-serif; fill: #f4f2ff }
    .local { fill: #ffdb6e } .global { fill: #bca8ff } .safe { fill: #96ece7 } .power { fill: #ff9b9e }
    .legend { font-size: 22px; font-weight: 600 } .heading { font-size: 30px; font-weight: 700 }
    .direction { font-size: 23px; font-weight: 700 } .score { font-size: 23px; font-variant-numeric: tabular-nums }
    .winner { fill: #96ece7; font-weight: 700 } .muted { fill: #c5c4dc; font-size: 19px }
    .weights { font-size: 20px; font-weight: 600 } .badge { fill: #96ece7; font-size: 19px; font-weight: 700 }
    .track { fill: #303149 } .panel { fill: #1c1c32; stroke: #42425c }
  </style>
  <defs>
    <g id="grid">
      <rect class="panel" x="1" y="1" width="548" height="263" rx="12"/>
      <path d="M67 81v128 m165 -128v128 m165 -128v128" fill="none" stroke="#52526b" stroke-dasharray="2 5"/>
      <g class="track">
        <rect x="67" y="99" width="330" height="23"/>
        <rect x="67" y="145" width="330" height="23"/>
        <rect x="67" y="191" width="330" height="23"/>
      </g>
      <g class="direction" text-anchor="end">
        <text x="50" y="120">上</text><text x="50" y="166">下</text><text x="50" y="212">左</text>
      </g>
      <g text-anchor="middle" class="muted">
        <text x="67" y="246">0</text><text x="232" y="246">0.5</text><text x="397" y="246">1</text>
      </g>
      <text x="510" y="246" text-anchor="end" class="muted">総合点</text>
    </g>
  </defs>
  <rect width="1120" height="375" fill="#151528"/>
  <g class="legend">
    <rect x="8" y="8" width="19" height="19" rx="3" class="local"/><text x="37" y="26">目先の採餌</text>
    <rect x="195" y="8" width="19" height="19" rx="3" class="global"/><text x="224" y="26">全体の回収</text>
    <rect x="386" y="8" width="19" height="19" rx="3" class="safe"/><text x="415" y="26">慎重さ</text>
    <rect x="525" y="8" width="19" height="19" rx="3" class="power"/><text x="554" y="26">パワー活用</text>
  </g>
  <text x="1110" y="26" text-anchor="end" class="muted">各色の長さ ＝ 項目の点 × 重み</text>
  <g transform="translate(0 51)">
    <use href="#grid"/>
    <text x="23" y="42" class="heading">均等配分</text>
    <text x="24" y="71" class="weights">4項目とも25%</text>
    <rect x="421" y="14" width="106" height="36" rx="18" fill="#283f43"/>
    <text x="474" y="39" text-anchor="middle" class="badge">上を選択</text>
    <g transform="translate(67 99)">
      <rect class="local" width="82.50" height="23"/><rect class="global" x="82.50" width="82.50" height="23"/>
      <rect class="safe" x="165" width="45.83" height="23"/><rect class="power" x="210.83" width="16.82" height="23"/>
    </g>
    <g transform="translate(67 145)">
      <rect class="local" width="36.44" height="23"/><rect class="global" x="36.44" width="68.75" height="23"/>
      <rect class="safe" x="105.19" width="82.50" height="23"/><rect class="power" x="187.69" width="19.62" height="23"/>
    </g>
    <g transform="translate(67 191)">
      <rect class="local" width="82.50" height="23"/><rect class="power" x="82.50" width="16.82" height="23"/>
    </g>
    <g class="score" text-anchor="end">
      <text x="510" y="120" class="winner">0.690</text><text x="510" y="166">0.628</text><text x="510" y="212">0.301</text>
    </g>
  </g>
  <g transform="translate(570 51)">
    <use href="#grid"/>
    <text x="23" y="42" class="heading">慎重重視</text>
    <g class="weights">
      <text x="24" y="71" class="local">目先15%</text><text x="134" y="71" class="global">全体10%</text>
      <text x="244" y="71" class="safe">慎重70%</text><text x="354" y="71" class="power">パワー5%</text>
    </g>
    <rect x="421" y="14" width="106" height="36" rx="18" fill="#283f43"/>
    <text x="474" y="39" text-anchor="middle" class="badge">下を選択</text>
    <g transform="translate(67 99)">
      <rect class="local" width="49.50" height="23"/><rect class="global" x="49.50" width="33" height="23"/>
      <rect class="safe" x="82.50" width="128.33" height="23"/><rect class="power" x="210.83" width="3.36" height="23"/>
    </g>
    <g transform="translate(67 145)">
      <rect class="local" width="21.86" height="23"/><rect class="global" x="21.86" width="27.50" height="23"/>
      <rect class="safe" x="49.36" width="231" height="23"/><rect class="power" x="280.36" width="3.93" height="23"/>
    </g>
    <g transform="translate(67 191)">
      <rect class="local" width="49.50" height="23"/><rect class="power" x="49.50" width="3.36" height="23"/>
    </g>
    <g class="score" text-anchor="end">
      <text x="510" y="120">0.649</text><text x="510" y="166" class="winner">0.861</text><text x="510" y="212">0.160</text>
    </g>
  </g>
  <text x="560" y="357" text-anchor="middle" font-size="24" font-weight="600">慎重さを70%にすると <tspan class="safe">下は慎重さだけで0.700点</tspan> を獲得</text>
</svg>
